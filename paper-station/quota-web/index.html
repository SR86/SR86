<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>额度助手 · 通知测试</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><main>
<header><span class="logo">Q</span><span>额度助手</span><small>个人工作站</small></header>
<p class="eyebrow">连接你的下一步</p><h1>额度就绪，<br>手机及时知道。</h1><p class="intro">先验证 Edge 的锁屏通知，再启用额度刷新提醒。</p>
<section><div class="label">01 / 环境检查</div><h2>让浏览器接收通知</h2><p id="support">正在检查浏览器能力…</p><button id="subscribe">允许通知并连接</button></section>
<section><div class="label">02 / 真实后台测试</div><h2>锁屏后，等一条消息</h2><p>点击后等待 30 秒发送。将 Edge 切到后台并锁屏，观察手机是否收到通知。</p><button id="test" disabled>30 秒后发送测试通知</button><button class="secondary" id="confirm">我在锁屏时收到了</button><p id="status" role="status" aria-live="polite">尚未订阅</p></section>
<footer>测试页 · 仅通过私有网络访问<br>当前不调用 AI 模型；额度自动监控尚未启用。</footer>
</main></body></html>
